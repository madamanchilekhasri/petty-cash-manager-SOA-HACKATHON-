
spring.application.name=petty-cash-manager

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petty_cash_db}
spring.datasource.username=${DB_USERNAME:pettyapp}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}
